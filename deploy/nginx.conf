server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "healthy\n";
  }

  # HTML and legacy Blockly assets use stable names. Revalidate them so an
  # upgrade cannot leave an old editor cached beside new code.
  location ~* \.(?:html|js|css|json|xml)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires -1;
    try_files $uri =404;
  }

  # Next.js emits content-hashed assets under this path.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
